apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Values.runId | trunc 20 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Indexed at every agent count: the collector locates pods by their
  # completion-index annotation, and a non-indexed single-agent Job carries
  # no annotation — the lookup would find no pod at all (fifth review,
  # finding 2).
  completions: {{ int .Values.agentCount }}
  parallelism: {{ int .Values.agentCount }}
  completionMode: Indexed
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Keep the container ALIVE after k6 exits until the collector has
          # the results: kubectl cp cannot reach a terminated container, so
          # the snapshot must happen while the pod still runs. k6 writes its
          # final summary and flushes the JSON stream on exit; the container
          # then waits for /out/collect-ack — created by the runner only
          # AFTER both result files copied completely — and exits with k6's
          # original code. COLLECT_MAX_HOLD_SECONDS bounds the wait so an
          # abandoned run still terminates (fifth review, finding 3).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              k6 run --out json=/out/k6.json --summary-export=/out/k6-summary.json /scripts/sideband-decision.js
              k6_exit=$?
              printf '%s\n' "${k6_exit}" > /out/k6-exit-code
              echo "k6 exited with code ${k6_exit}; waiting for collection (ack file or hold timeout)"
              waited=0
              max_hold="${COLLECT_MAX_HOLD_SECONDS:-1200}"
              while [ ! -f /out/collect-ack ] && [ "${waited}" -lt "${max_hold}" ]; do
                sleep 2
                waited=$((waited + 2))
              done
              if [ -f /out/collect-ack ]; then
                echo "collection acknowledged after ${waited}s"
              else
                echo "collection hold expired after ${waited}s without acknowledgement" >&2
              fi
              exit ${k6_exit}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: AGENT_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: AGENT_COUNT
              value: {{ int .Values.agentCount | quote }}
            - name: RUN_ID
              value: {{ .Release.Name }}-{{ .Values.runId | trunc 20 | trimSuffix "-" }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /out
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-script
        - name: results
          emptyDir: {}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
